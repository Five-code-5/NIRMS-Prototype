{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<h1>Change password</h1>
{% if forced %}<p class="sub"><strong>You are still using the starting password.</strong> Please choose a new one before continuing.</p>
{% else %}<p class="sub">Choose a new password for your NOC account.</p>{% endif %}
<div class="card" style="max-width:460px">
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field"><label for="current">Current password</label>
      <input type="password" id="current" name="current" required autofocus></div>
    <div class="field"><label for="new">New password (at least 8 characters)</label>
      <input type="password" id="new" name="new" required minlength="8"></div>
    <div class="field"><label for="again">Type the new password again</label>
      <input type="password" id="again" name="again" required></div>
    <button class="btn">Save new password</button>
  </form>
</div>
{% endblock %}
